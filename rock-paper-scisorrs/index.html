<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rock Paper Scissors</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="container">
        <h1>Rock Paper Scissors</h1>

        <div id="choices">
            <button class="choiceBtn" data-choice="rock">🪨 Rock</button>
            <button class="choiceBtn" data-choice="paper">📄 Paper</button>
            <button class="choiceBtn" data-choice="scissors">✂️ Scissors</button>
        </div>

        <div id="resultArea">
            <p id="userChoice">You: --</p>
            <p id="computerChoice">Computer: --</p>
            <p id="result">Result: --</p>
        </div>

        <div id="scoreBoard">
            <p>Wins: <span id="winCount">0</span></p>
            <p>Losses: <span id="lossCount">0</span></p>
            <p>Ties: <span id="tieCount">0</span></p>
        </div>
    </div>

    <script src="index.js"></script>
</body>
</html>
