<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Temperature Converter</title>
</head>
<body>
    <div id="main">
        <h1>Temperature Converter</h1>

        <div class="input-row">
            <label for="tempInput">Temperature:</label>
            <input type="number" id="tempInput">
        </div>

        <div class="input-row">
            <label for="direction">Convert to:</label>
            <select id="direction">
                <option value="toFahrenheit">Celsius → Fahrenheit</option>
                <option value="toCelsius">Fahrenheit → Celsius</option>
            </select>
        </div>

        <button id="convertBtn">Convert</button>

        <p id="result">Result: --</p>
    </div>

    <script src="index.js"></script>
</body>
</html>
